[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qanun"
version = "0.1.0"
description = "Bilingual question answering over Qatar's Labour Law with cited articles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohaned Elhagar" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "snowballstemmer>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# Install PyTorch first (CPU build: pip install torch --index-url https://download.pytorch.org/whl/cpu)
embeddings = ["sentence-transformers>=3.0"]
# The data tools come from GitHub, pinned to a commit. qatar-data-checks runs data/corpus/checks.yaml,
# and qatar-abtest checks the bootstrap intervals in eval/results.md.
dev = [
    "pytest>=8",
    "qatar-data-checks @ git+https://github.com/Ifazawezk/qatar-data-checks@1736f845d9cadac8d7c569625d28e3c83a005f7a",
    "qatar-abtest @ git+https://github.com/Ifazawezk/qatar-abtest@be4baeb8e91832821c48e297e69a70eb5d8c3cfc",
]

[project.scripts]
qanun = "qanun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qanun.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
